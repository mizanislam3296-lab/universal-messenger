name: Build Universal Messenger APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-Fix & Organize Dart Files
        run: |
          cat << 'PYEOF' > organize_dart.py
          import os, shutil
          os.makedirs("lib_clean/screens", exist_ok=True)
          mapping = {
              "auth": "lib_clean/screens/auth_screen.dart",
              "verify": "lib_clean/screens/verify_email_screen.dart",
              "home": "lib_clean/screens/home_screen.dart",
              "search": "lib_clean/screens/search_user_screen.dart",
              "chat": "lib_clean/screens/chat_screen.dart",
              "call": "lib_clean/screens/call_screen.dart",
          }
          for root, _, files in os.walk(".", topdown=False):
              if ".git" in root or "lib_clean" in root:
                  continue
              for f in files:
                  norm = f.replace(" ", "").lower()
                  if norm.endswith((".yml", ".yaml", ".json", ".md", ".py")):
                      continue
                  src = os.path.join(root, f)
                  if "main" in norm and ("dart" in norm or root.strip().endswith("lib")):
                      shutil.copy2(src, "lib_clean/main.dart")
                  else:
                      for k, dst in mapping.items():
                          if k in norm:
                              shutil.copy2(src, dst)
          for req in ["lib_clean/main.dart"] + list(mapping.values()):
              if not os.path.exists(req):
                  raise SystemExit("MISSING FILE: " + req)
          PYEOF
          python3 organize_dart.py && rm -f organize_dart.py

          flutter create . --platforms=android --org com.universal --project-name universal_messenger
          rm -rf lib test && mv lib_clean lib

      - name: Configure Firebase, ZegoCloud & Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          [ -f "google-services.json" ] && cp google-services.json android/app/google-services.json
          [ ! -f "android/app/google-services.json" ] && exit 1

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          else
            keytool -genkey -v -keystore android/app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias messenger_key -storepass "Messenger@2026" -keypass "Messenger@2026" -dname "CN=Universal Messenger, OU=Mobile, O=Universal, L=Dhaka, S=Dhaka, C=BD"
          fi

          printf -- "-keep class **.zego.** { *; }\n-keep class **.zegocloud.** { *; }\n-dontwarn **\n" > android/app/proguard-rules.pro

          cat << 'PYEOF' > configure_android.py
          import os, shutil

          for lang in ["kotlin", "java"]:
              shutil.rmtree(f"android/app/src/main/{lang}", ignore_errors=True)
          tdir = "android/app/src/main/kotlin/com/universal/messenger"
          os.makedirs(tdir, exist_ok=True)
          open(f"{tdir}/MainActivity.kt", "w").write("package com.universal.messenger\nimport io.flutter.embedding.android.FlutterActivity\nclass MainActivity : FlutterActivity()\n")

          if os.path.exists("android/gradle.properties"):
              gp = open("android/gradle.properties").read().replace("-Xmx2G", "-Xmx4G").replace("-Xmx1536M", "-Xmx4G")
              gp += "\nandroid.enableJetifier=true\nkotlin.jvm.target.validation.mode=warning\n"
              open("android/gradle.properties", "w").write(gp)

          if os.path.exists("android/settings.gradle.kts"):
              s = open("android/settings.gradle.kts").read()
              s = s.replace('apply false', 'apply false\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
              s += '\ngradle.beforeProject {\n    listOf("compileSdk", "compileSdkVersion", "targetSdk", "targetSdkVersion").forEach { extensions.extraProperties.set(it, 35) }\n    listOf("minSdk", "minSdkVersion").forEach { extensions.extraProperties.set(it, 23) }\n    extensions.extraProperties.set("javaVersion", org.gradle.api.JavaVersion.VERSION_17)\n}\n'
              open("android/settings.gradle.kts", "w").write(s)

          if os.path.exists("android/build.gradle.kts"):
              b = open("android/build.gradle.kts").read()
              fix = '''
          allprojects {
              listOf("compileSdk", "compileSdkVersion", "targetSdk", "targetSdkVersion").forEach { extensions.extraProperties.set(it, 35) }
              listOf("minSdk", "minSdkVersion").forEach { extensions.extraProperties.set(it, 23) }
              extensions.extraProperties.set("javaVersion", org.gradle.api.JavaVersion.VERSION_17)
          }
          subprojects {
              plugins.withId("com.android.library") {
                  val ext = extensions.findByName("android") ?: return@withId
                  try {
                      val cur = ext.javaClass.getMethod("getNamespace").invoke(ext) as? String
                      if (cur.isNullOrEmpty()) {
                          val mf = file("src/main/AndroidManifest.xml")
                          val pkg = if (mf.exists()) Regex("package\\\\s*=\\\\s*[\\"']([^\\"']+)[\\"']").find(mf.readText())?.groupValues?.get(1) else null
                          ext.javaClass.getMethod("setNamespace", String::class.java).invoke(ext, pkg ?: ("com.universal.plugin." + project.name.replace("-", "_").replace(".", "_")))
                      }
                      ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 35)
                  } catch (_: Exception) {}
              }
          }
          '''
              open("android/build.gradle.kts", "w").write(b + "\n" + fix)

          if os.path.exists("android/app/build.gradle.kts"):
              c = open("android/app/build.gradle.kts").read().replace("com.universal.universal_messenger", "com.universal.messenger")
              c = c.replace('id("com.android.application")', 'id("com.android.application")\n    id("com.google.gms.google-services")')
              c = c.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 35")
              c = c.replace("minSdk = flutter.minSdkVersion", "minSdk = 23\n        multiDexEnabled = true")
              sign = '    lint { checkReleaseBuilds = false; abortOnError = false }\n    signingConfigs { create("release") { storeFile = file("release.jks"); storePassword = "Messenger@2026"; keyAlias = "messenger_key"; keyPassword = "Messenger@2026" } }\n    buildTypes {'
              c = c.replace("    buildTypes {", sign, 1)
              c = c.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")')
              open("android/app/build.gradle.kts", "w").write(c)

          mp = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mp):
              perms = ''.join(f'    <uses-permission android:name="android.permission.{p}"/>\n' for p in ["INTERNET","CAMERA","RECORD_AUDIO","MODIFY_AUDIO_SETTINGS","ACCESS_NETWORK_STATE","ACCESS_WIFI_STATE","BLUETOOTH","BLUETOOTH_CONNECT","WAKE_LOCK"])
              perms += '    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application'
              open(mp, "w").write(open(mp).read().replace("<application", perms, 1))
          PYEOF
          python3 configure_android.py && rm -f configure_android.py

      - name: Install Packages & Fix Plugin Order
        run: |
          flutter pub add dio file_picker url_launcher zego_uikit_prebuilt_call
          flutter pub get

          cat << 'PYEOF' > fix_plugins.py
          import os, re

          cache = os.environ.get("PUB_CACHE") or os.path.expanduser("~/.pub-cache")
          for root, _, files in os.walk(cache):
              for fname in files:
                  if fname not in ("build.gradle", "build.gradle.kts"):
                      continue
                  path = os.path.join(root, fname)
                  if any(skip in path for skip in ("/example/", "/firebase_", "/cloud_firestore", "/flutter/")):
                      continue
                  text = open(path, encoding="utf-8", errors="ignore").read().lstrip("\ufeff").replace("\r\n", "\n")
                  if not any(k in text for k in ("com.android.library", "LibraryExtension", "android {", "android{")):
                      continue

                  orig = text
                  is_kts = fname.endswith(".kts")
                  has_kt = ("kotlin-android" in text) or ("org.jetbrains.kotlin.android" in text)

                  bs = ""
                  m_bs = re.search(r'(?m)^\s*buildscript\s*\{', text)
                  if m_bs:
                      s = m_bs.start()
                      i = text.find("{", s)
                      d = 0
                      for k in range(i, len(text)):
                          d += (1 if text[k] == "{" else (-1 if text[k] == "}" else 0))
                          if d == 0:
                              bs = text[s:k+1] + "\n\n"
                              text = text[:s] + text[k+1:]
                              break

                  text = re.sub(r'(?m)^.*apply.*com\.android\.library.*\n?', '', text)
                  text = re.sub(r'(?m)^.*apply.*kotlin-android.*\n?', '', text)

                  m_pl = re.search(r'(?m)^\s*plugins\s*\{', text)
                  if m_pl:
                      s = m_pl.start()
                      i = text.find("{", s)
                      d = 0
                      for k in range(i, len(text)):
                          d += (1 if text[k] == "{" else (-1 if text[k] == "}" else 0))
                          if d == 0:
                              inner = [ln.strip() for ln in text[i+1:k].splitlines() if ln.strip() and "com.android.library" not in ln and "kotlin-android" not in ln and "kotlin.android" not in ln]
                              head = ['id("com.android.library")' if is_kts else 'id "com.android.library"']
                              if has_kt:
                                  head.append('id("org.jetbrains.kotlin.android")' if is_kts else 'id "kotlin-android"')
                              pl = "plugins {\n    " + "\n    ".join(head + inner) + "\n}\n\n"
                              text = bs + pl + (text[:s] + text[k+1:]).lstrip("\n")
                              break
                  elif is_kts:
                      head = ['id("com.android.library")'] + (['id("org.jetbrains.kotlin.android")'] if has_kt else [])
                      text = bs + "plugins {\n    " + "\n    ".join(head) + "\n}\n\n" + text.lstrip("\n")
                  else:
                      inj = 'apply plugin: "com.android.library"\n' + ('apply plugin: "kotlin-android"\n' if has_kt else '')
                      text = bs + inj + "\n" + text.lstrip("\n")

                  if text != orig:
                      open(path, "w", encoding="utf-8").write(text)
                      print("PATCHED:", path)
          PYEOF
          python3 fix_plugins.py && rm -f fix_plugins.py

      - name: Build Release APK
        run: flutter build apk --release --no-pub

      - name: Publish Direct APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Universal-Messenger.apk
          gh release create "v4.0.${{ github.run_number }}" Universal-Messenger.apk --title "Universal Messenger v4.0.${{ github.run_number }}" --notes "Phase 3B: Audio & Video Calling Complete"
