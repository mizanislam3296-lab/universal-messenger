name: Build Universal Messenger APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Merge & Prepare Dart Files Safely
        run: |
          python3 -c '
          import os, shutil
          os.makedirs("lib_backup", exist_ok=True)
          for entry in os.listdir("."):
              if os.path.isdir(entry) and entry.strip() == "lib":
                  for root, dirs, files in os.walk(entry):
                      rel_dir = os.path.relpath(root, entry)
                      clean_rel = "/".join(p.strip() for p in rel_dir.split("/")) if rel_dir != "." else ""
                      target_dir = os.path.join("lib_backup", clean_rel) if clean_rel else "lib_backup"
                      os.makedirs(target_dir, exist_ok=True)
                      for f in files:
                          clean_f = f.strip()
                          if not clean_f.endswith(".dart"):
                              clean_f += ".dart"
                          shutil.copy2(os.path.join(root, f), os.path.join(target_dir, clean_f))
          '
          flutter create . --platforms=android --org com.universal --project-name universal_messenger
          python3 -c '
          import os, shutil
          for entry in os.listdir("."):
              if os.path.isdir(entry) and entry.strip() == "lib":
                  shutil.rmtree(entry)
          if os.path.exists("test"):
              shutil.rmtree("test")
          '
          mv lib_backup lib

      - name: Configure Firebase & Universal Android Support
        run: |
          mkdir -p android/app
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json ফাইলটি রিপোজিটরিতে পাওয়া যায়নি!"
            exit 1
          fi

          python3 -c '
          import os

          if os.path.exists("android/settings.gradle.kts"):
              with open("android/settings.gradle.kts", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  out.append(l)
                  if "com.android.application" in l and "apply false" in l:
                      out.append("    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false")
              with open("android/settings.gradle.kts", "w") as f:
                  f.write("\n".join(out) + "\n")
          elif os.path.exists("android/settings.gradle"):
              with open("android/settings.gradle", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  out.append(l)
                  if "com.android.application" in l and "apply false" in l:
                      out.append("    id \"com.google.gms.google-services\" version \"4.4.2\" apply false")
              with open("android/settings.gradle", "w") as f:
                  f.write("\n".join(out) + "\n")

          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r") as f:
                  content = f.read()
              content = content.replace("com.universal.universal_messenger", "com.universal.messenger")
              lines = content.splitlines()
              out = []
              for l in lines:
                  if "minSdk =" in l or "minSdkVersion" in l:
                      out.append("        minSdk = 21")
                      out.append("        multiDexEnabled = true")
                      continue
                  out.append(l)
                  if "id(\"com.android.application\")" in l:
                      out.append("    id(\"com.google.gms.google-services\")")
              with open("android/app/build.gradle.kts", "w") as f:
                  f.write("\n".join(out) + "\n")
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r") as f:
                  content = f.read()
              content = content.replace("com.universal.universal_messenger", "com.universal.messenger")
              lines = content.splitlines()
              out = []
              for l in lines:
                  if "minSdk =" in l or "minSdkVersion" in l:
                      out.append("        minSdkVersion 21")
                      out.append("        multiDexEnabled true")
                      continue
                  out.append(l)
                  if "com.android.application" in l:
                      out.append("    id \"com.google.gms.google-services\"")
              with open("android/app/build.gradle", "w") as f:
                  f.write("\n".join(out) + "\n")

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              if "android.permission.INTERNET" not in m:
                  m = m.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application", 1)
                  with open(manifest_path, "w") as f:
                      f.write(m)
          '

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Messenger-Step1-APK
          path: build/app/outputs/flutter-apk/app-release.apk
