name: Build Universal Messenger APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-Fix & Organize Dart Files
        run: |
          cat << 'PYEOF' > organize_dart.py
          import os, shutil

          os.makedirs("lib_clean/screens", exist_ok=True)
          for root, dirs, files in os.walk(".", topdown=False):
              if ".git" in root or "lib_clean" in root:
                  continue
              for f in files:
                  norm = f.replace(" ", "").lower()
                  if norm.endswith((".yml", ".yaml", ".json", ".md", ".py")):
                      continue
                  src = os.path.join(root, f)
                  if "main" in norm and ("dart" in norm or root.strip().endswith("lib")):
                      shutil.copy2(src, "lib_clean/main.dart")
                  elif "auth" in norm:
                      shutil.copy2(src, "lib_clean/screens/auth_screen.dart")
                  elif "verify" in norm:
                      shutil.copy2(src, "lib_clean/screens/verify_email_screen.dart")
                  elif "home" in norm:
                      shutil.copy2(src, "lib_clean/screens/home_screen.dart")
                  elif "search" in norm:
                      shutil.copy2(src, "lib_clean/screens/search_user_screen.dart")
                  elif "chat" in norm:
                      shutil.copy2(src, "lib_clean/screens/chat_screen.dart")
                  elif "call" in norm:
                      shutil.copy2(src, "lib_clean/screens/call_screen.dart")

          req_files = [
              "lib_clean/main.dart",
              "lib_clean/screens/auth_screen.dart",
              "lib_clean/screens/verify_email_screen.dart",
              "lib_clean/screens/home_screen.dart",
              "lib_clean/screens/search_user_screen.dart",
              "lib_clean/screens/chat_screen.dart",
              "lib_clean/screens/call_screen.dart",
          ]
          for req in req_files:
              if not os.path.exists(req):
                  raise SystemExit("MISSING FILE: " + req)
          PYEOF
          python3 organize_dart.py
          rm -f organize_dart.py

          flutter create . --platforms=android --org com.universal --project-name universal_messenger
          rm -rf lib test
          mv lib_clean lib

      - name: Configure Firebase, ZegoCloud, Release Signing & Android Support
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json ফাইলটি রিপোজিটরিতে পাওয়া যায়নি!"
            exit 1
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          else
            keytool -genkey -v -keystore android/app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias messenger_key -storepass "Messenger@2026" -keypass "Messenger@2026" -dname "CN=Universal Messenger, OU=Mobile, O=Universal, L=Dhaka, S=Dhaka, C=BD"
          fi

          printf -- "-keep class **.zego.** { *; }\n-keep class **.zegocloud.** { *; }\n" > android/app/proguard-rules.pro

          cat << 'PYEOF' > configure_android.py
          import os, shutil

          for lang in ["kotlin", "java"]:
              base = f"android/app/src/main/{lang}"
              if os.path.exists(base):
                  shutil.rmtree(base)
          target_dir = "android/app/src/main/kotlin/com/universal/messenger"
          os.makedirs(target_dir, exist_ok=True)
          with open(f"{target_dir}/MainActivity.kt", "w") as f:
              f.write("package com.universal.messenger\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity : FlutterActivity()\n")

          if os.path.exists("android/gradle.properties"):
              with open("android/gradle.properties", "r") as f:
                  gp = f.read()
              gp = gp.replace("-Xmx2G", "-Xmx4G").replace("-Xmx1536M", "-Xmx4G").replace("-Xmx1G", "-Xmx4G")
              with open("android/gradle.properties", "w") as f:
                  f.write(gp)

          if os.path.exists("android/build.gradle.kts"):
              with open("android/build.gradle.kts", "r") as f:
                  rb = f.read()
              ns_fix = """
          subprojects {
              plugins.withId("com.android.library") {
                  val androidExt = extensions.findByName("android")
                  if (androidExt != null) {
                      try {
                          val getNs = androidExt.javaClass.getMethod("getNamespace")
                          val curNs = getNs.invoke(androidExt) as? String
                          if (curNs.isNullOrEmpty()) {
                              val setNs = androidExt.javaClass.getMethod("setNamespace", String::class.java)
                              val safeName = "com.universal.plugin." + project.name.replace("-", "_").replace(".", "_")
                              setNs.invoke(androidExt, safeName)
                          }
                      } catch (_: Exception) {}
                  }
              }
          }
          """
              with open("android/build.gradle.kts", "w") as f:
                  f.write(rb + "\n" + ns_fix)

          if os.path.exists("android/settings.gradle.kts"):
              with open("android/settings.gradle.kts", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  out.append(l)
                  if "com.android.application" in l and "apply false" in l:
                      out.append('    id("com.google.gms.google-services") version "4.4.2" apply false')
              with open("android/settings.gradle.kts", "w") as f:
                  f.write("\n".join(out) + "\n")
          elif os.path.exists("android/settings.gradle"):
              with open("android/settings.gradle", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  out.append(l)
                  if "com.android.application" in l and "apply false" in l:
                      out.append('    id "com.google.gms.google-services" version "4.4.2" apply false')
              with open("android/settings.gradle", "w") as f:
                  f.write("\n".join(out) + "\n")

          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r") as f:
                  content = f.read()
              content = content.replace("com.universal.universal_messenger", "com.universal.messenger")
              signing_block = (
                  '    lint {\n'
                  '        checkReleaseBuilds = false\n'
                  '        abortOnError = false\n'
                  '    }\n'
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            storeFile = file("release.jks")\n'
                  '            storePassword = "Messenger@2026"\n'
                  '            keyAlias = "messenger_key"\n'
                  '            keyPassword = "Messenger@2026"\n'
                  '        }\n'
                  '    }\n'
                  '    buildTypes {'
              )
              content = content.replace("    buildTypes {", signing_block, 1)
              content = content.replace(
                  'signingConfigs.getByName("debug")',
                  'signingConfigs.getByName("release")\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
              )
              lines = content.splitlines()
              out = []
              for l in lines:
                  if "minSdk =" in l or "minSdkVersion" in l:
                      out.append("        minSdk = 23")
                      out.append("        multiDexEnabled = true")
                      continue
                  out.append(l)
                  if 'id("com.android.application")' in l:
                      out.append('    id("com.google.gms.google-services")')
              with open("android/app/build.gradle.kts", "w") as f:
                  f.write("\n".join(out) + "\n")
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r") as f:
                  content = f.read()
              content = content.replace("com.universal.universal_messenger", "com.universal.messenger")
              signing_block = (
                  '    lint {\n'
                  '        checkReleaseBuilds false\n'
                  '        abortOnError false\n'
                  '    }\n'
                  '    signingConfigs {\n'
                  '        release {\n'
                  '            storeFile file("release.jks")\n'
                  '            storePassword "Messenger@2026"\n'
                  '            keyAlias "messenger_key"\n'
                  '            keyPassword "Messenger@2026"\n'
                  '        }\n'
                  '    }\n'
                  '    buildTypes {'
              )
              content = content.replace("    buildTypes {", signing_block, 1)
              content = content.replace(
                  'signingConfigs.debug',
                  'signingConfigs.release\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"'
              )
              lines = content.splitlines()
              out = []
              for l in lines:
                  if "minSdk =" in l or "minSdkVersion" in l:
                      out.append("        minSdkVersion 23")
                      out.append("        multiDexEnabled true")
                      continue
                  out.append(l)
                  if "com.android.application" in l:
                      out.append('    id "com.google.gms.google-services"')
              with open("android/app/build.gradle", "w") as f:
                  f.write("\n".join(out) + "\n")

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              perms = (
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n'
                  '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
                  '    <queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW" />\n'
                  '            <data android:scheme="https" />\n'
                  '        </intent>\n'
                  '    </queries>\n'
                  '    <application'
              )
              m = m.replace("<application", perms, 1)
              with open(manifest_path, "w") as f:
                  f.write(m)
          PYEOF
          python3 configure_android.py
          rm -f configure_android.py

      - name: Install Media & Calling Packages
        run: |
          flutter pub add dio file_picker url_launcher zego_uikit_prebuilt_call
          flutter pub get

          cat << 'PYEOF' > fix_plugins.py
          import os, re

          caches = set()
          if os.environ.get("PUB_CACHE"):
              caches.add(os.environ["PUB_CACHE"])
          caches.add(os.path.expanduser("~/.pub-cache"))
          caches.add("/home/runner/.pub-cache")
          caches.add("/root/.pub-cache")

          keywords = (
              "com.android.library",
              "LibraryExtension",
              "android {",
              "android{",
              "compileSdk",
              "minSdk",
              "kotlin-android",
              "org.jetbrains.kotlin.android",
          )

          seen = set()
          for cache in caches:
              if not os.path.exists(cache):
                  continue
              for root, dirs, files in os.walk(cache):
                  for fname in files:
                      if fname not in ("build.gradle", "build.gradle.kts"):
                          continue
                      path = os.path.join(root, fname)
                      if path in seen or "/example/" in path:
                          continue
                      seen.add(path)

                      with open(path, "r", encoding="utf-8", errors="ignore") as f:
                          text = f.read().replace("\r\n", "\n")
                      orig = text

                      if "com.android.application" in text:
                          continue
                      if not any(k in text for k in keywords):
                          continue

                      is_kts = fname.endswith(".kts")
                      has_kotlin = ("kotlin-android" in text) or ("org.jetbrains.kotlin.android" in text)

                      m = re.search(r'\bplugins\s*\{', text)
                      if m:
                          start = m.start()
                          brace_start = text.find("{", start)
                          depth = 0
                          end = brace_start
                          for idx in range(brace_start, len(text)):
                              if text[idx] == "{":
                                  depth += 1
                              elif text[idx] == "}":
                                  depth -= 1
                                  if depth == 0:
                                      end = idx + 1
                                      break
                          block = text[brace_start + 1 : end - 1]
                          rest = text[:start] + text[end:]

                          rest = re.sub(r'^\s*apply\s+plugin\s*:\s*[\'"]com\.android\.library[\'"].*$', '', rest, flags=re.M)
                          rest = re.sub(r'^\s*apply\s*\(\s*plugin\s*=\s*[\'"]com\.android\.library[\'"]\s*\).*$', '', rest, flags=re.M)

                          body_lines = []
                          for line in block.replace(";", "\n").splitlines():
                              s = line.strip()
                              if not s or "com.android.library" in s:
                                  continue
                              body_lines.append("    " + s)

                          lib_decl = '    id("com.android.library")' if is_kts else '    id "com.android.library"'
                          new_plugins = "plugins {\n" + lib_decl + "\n" + ("\n".join(body_lines) + "\n" if body_lines else "") + "}\n"
                          text = new_plugins + rest.lstrip("\n")
                      elif is_kts:
                          text = re.sub(r'^\s*apply\s*\(\s*plugin\s*=\s*[\'"]com\.android\.library[\'"]\s*\).*\n?', '', text, flags=re.M)
                          text = re.sub(r'^\s*apply\s*\(\s*plugin\s*=\s*[\'"](?:kotlin-android|org\.jetbrains\.kotlin\.android)[\'"]\s*\).*\n?', '', text, flags=re.M)
                          p_lines = ['    id("com.android.library")']
                          if has_kotlin:
                              p_lines.append('    id("org.jetbrains.kotlin.android")')
                          text = "plugins {\n" + "\n".join(p_lines) + "\n}\n" + text.lstrip("\n")
                      else:
                          text = re.sub(r'^\s*apply\s+plugin\s*:\s*[\'"]com\.android\.library[\'"].*\n?', '', text, flags=re.M)
                          text = re.sub(r'^\s*apply\s+plugin\s*:\s*[\'"](?:kotlin-android|org\.jetbrains\.kotlin\.android)[\'"].*\n?', '', text, flags=re.M)
                          inject = 'apply plugin: "com.android.library"\n'
                          if has_kotlin:
                              inject += 'apply plugin: "kotlin-android"\n'
                          if re.search(r'^\s*android\s*\{', text, flags=re.M):
                              text = re.sub(r'^(\s*android\s*\{)', inject + r'\1', text, count=1, flags=re.M)
                          else:
                              text = inject + text

                      if text != orig:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(text)
                          print("PATCHED:", path)
          PYEOF
          python3 fix_plugins.py
          rm -f fix_plugins.py

      - name: Build Release APK
        run: flutter build apk --release --no-pub

      - name: Publish Direct APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Universal-Messenger.apk
          gh release create "v4.0.${{ github.run_number }}" Universal-Messenger.apk --title "Universal Messenger v4.0.${{ github.run_number }}" --notes "Phase 3B: Audio & Video Calling Complete"
