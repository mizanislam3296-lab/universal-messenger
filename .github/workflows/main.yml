name: Build Universal Messenger APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate Android Platform
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.universal --project-name universal_messenger
      - name: Get Dependencies
        run: flutter pub get
      - name: Configure Android, Firebase & Plugin Order
        run: python3 scripts/configure_android.py
      - name: Build Release APK
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            echo "FCM_SERVICE_ACCOUNT detected"
            FCM_B64=$(printf '%s' "$FCM_SERVICE_ACCOUNT" | base64 -w 0)
            flutter build apk --release --split-per-abi --dart-define=FCM_SA_B64=$FCM_B64
          else
            echo "WARNING: FCM_SERVICE_ACCOUNT empty"
            flutter build apk --release --split-per-abi
          fi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Messenger-v14-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v14.0.0
          name: Universal Messenger v14.0.0
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
