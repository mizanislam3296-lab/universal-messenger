
name: Build Universal Messenger APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # 3. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Prepare Dart project without deleting source files
      - name: Prepare Flutter Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib

          for f in \
            main.dart \
            auth_screen.dart \
            verify_email_screen.dart \
            home_screen.dart \
            search_user_screen.dart \
            chat_screen.dart \
            call_screen.dart
          do
            if [ ! -f "lib/$f" ] && [ -f "$f" ]; then
              cp "$f" "lib/$f"
            fi
          done

          required=(
            main.dart
            auth_screen.dart
            verify_email_screen.dart
            home_screen.dart
            search_user_screen.dart
            chat_screen.dart
            call_screen.dart
          )

          for f in "${required[@]}"; do
            if [ ! -f "lib/$f" ]; then
              echo "ERROR: Missing lib/$f"
              exit 1
            fi
          done

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml missing"
            exit 1
          fi

          flutter create . \
            --platforms=android \
            --org com.universal \
            --project-name universal_messenger

          echo "Flutter project prepared."

      # 5. Firebase configuration
      - name: Configure Firebase
        run: |
          set -euo pipefail

          mkdir -p android/app

          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json missing"
            exit 1
          fi

          cp google-services.json android/app/google-services.json

          if [ ! -f android/app/google-services.json ]; then
            exit 1
          fi

      # 6. Install dependencies
      - name: Install Flutter Dependencies
        run: |
          set -euo pipefail
          flutter pub get
          flutter pub deps

      # 7. Configure Gradle, Firebase properties and namespace
      - name: Configure Android Gradle
        shell: bash
        run: |
          set -euo pipefail

          cat > configure_gradle.py <<'PYEOF'
          import os
          import re
          import glob

          settings_files = [
              "android/settings.gradle.kts",
              "android/settings.gradle"
          ]

          settings = next(
              (p for p in settings_files if os.path.isfile(p)),
              None
          )

          if not settings:
              raise SystemExit("Android settings.gradle not found")

          is_kts = settings.endswith(".kts")

          with open(settings, encoding="utf-8") as f:
              content = f.read()

          # Google Services plugin
          if "com.google.gms.google-services" not in content:
              if is_kts:
                  line = '    id("com.google.gms.google-services") version "4.4.2" apply false'
              else:
                  line = '    id "com.google.gms.google-services" version "4.4.2" apply false'

              match = re.search(
                  r'(?m)^\s*id\s*\(?\s*["\']com\.android\.application["\'][^\n]*$',
                  content
              )

              if match:
                  pos = match.end()
                  content = content[:pos] + "\n" + line + content[pos:]
              else:
                  raise SystemExit(
                      "Cannot safely add Google Services plugin. "
                      "Inspect settings.gradle."
                  )

          # Firebase and older plugin extra properties.
          marker = "// UNIVERSAL_MESSENGER_BEFORE_PROJECT"

          if marker not in content:
              if is_kts:
                  block = """
          // UNIVERSAL_MESSENGER_BEFORE_PROJECT
          gradle.beforeProject { p ->
              val extras = p.extensions.extraProperties
              extras.set("compileSdk", 35)
              extras.set("compileSdkVersion", 35)
              extras.set("minSdk", 23)
              extras.set("minSdkVersion", 23)
              extras.set("targetSdk", 35)
              extras.set("targetSdkVersion", 35)
              extras.set(
                  "javaVersion",
                  org.gradle.api.JavaVersion.VERSION_17
              )
          }
          """
              else:
                  block = """
          // UNIVERSAL_MESSENGER_BEFORE_PROJECT
          gradle.beforeProject { p ->
              p.extensions.extraProperties.set("compileSdk", 35)
              p.extensions.extraProperties.set("compileSdkVersion", 35)
              p.extensions.extraProperties.set("minSdk", 23)
              p.extensions.extraProperties.set("minSdkVersion", 23)
              p.extensions.extraProperties.set("targetSdk", 35)
              p.extensions.extraProperties.set("targetSdkVersion", 35)
              p.extensions.extraProperties.set(
                  "javaVersion",
                  org.gradle.api.JavaVersion.VERSION_17
              )
          }
          """
                  # Groovy Gradle supports the same JavaVersion constant.

              content += "\n" + block

          with open(settings, "w", encoding="utf-8") as f:
              f.write(content)

          print("Configured:", settings)

          # Root Gradle namespace compatibility.
          root_files = [
              "android/build.gradle.kts",
              "android/build.gradle"
          ]

          root_gradle = next(
              (p for p in root_files if os.path.isfile(p)),
              None
          )

          if not root_gradle:
              raise SystemExit("Root Android build.gradle missing")

          root_kts = root_gradle.endswith(".kts")

          with open(root_gradle, encoding="utf-8") as f:
              root_content = f.read()

          ns_marker = "// UNIVERSAL_MESSENGER_NAMESPACE_FIX"

          if ns_marker not in root_content:
              if root_kts:
                  ns_block = """
          // UNIVERSAL_MESSENGER_NAMESPACE_FIX
          subprojects {
              val targetProject = this

              plugins.withId("com.android.library") {
                  val androidExt =
                      targetProject.extensions.findByName("android")

                  if (androidExt != null) {
                      try {
                          val getter = androidExt.javaClass
                              .getMethod("getNamespace")

                          val current = getter.invoke(androidExt) as? String

                          if (current.isNullOrBlank()) {
                              val manifest = java.io.File(
                                  targetProject.projectDir,
                                  "src/main/AndroidManifest.xml"
                              )

                              val manifestText =
                                  if (manifest.exists()) manifest.readText()
                                  else ""

                              val match = Regex(
                                  """package\\s*=\\s*["']([^"']+)["']"""
                              ).find(manifestText)

                              val safeName = targetProject.name
                                  .replace("-", "_")
                                  .replace(".", "_")

                              val namespace = match?.groupValues?.get(1)
                                  ?: "com.universal.plugin." + safeName

                              androidExt.javaClass
                                  .getMethod("setNamespace", String::class.java)
                                  .invoke(androidExt, namespace)
                          }
                      } catch (e: Exception) {
                          throw GradleException(
                              "Namespace configuration failed for " +
                                  targetProject.path, e
                          )
                      }
                  }
              }
          }
          """
              else:
                  ns_block = """
          // UNIVERSAL_MESSENGER_NAMESPACE_FIX
          subprojects { p ->
              p.plugins.withId("com.android.library") {
                  def androidExt = p.extensions.findByName("android")

                  if (androidExt != null) {
                      def getter = androidExt.class.methods.find {
                          it.name == "getNamespace"
                      }

                      def current = getter ? getter.invoke(androidExt) : null

                      if (!current) {
                          def manifest = new File(
                              p.projectDir,
                              "src/main/AndroidManifest.xml"
                          )

                          def manifestText = manifest.exists()
                              ? manifest.getText("UTF-8")
                              : ""

                          def matcher = manifestText =~ /package\\s*=\\s*["']([^"']+)["']/

                          def safeName = p.name
                              .replace("-", "_")
                              .replace(".", "_")

                          def namespace = matcher.find()
                              ? matcher.group(1)
                              : "com.universal.plugin." + safeName

                          androidExt.namespace = namespace
                      }
                  }
              }
          }
          """

              root_content += "\n" + ns_block

          with open(root_gradle, "w", encoding="utf-8") as f:
              f.write(root_content)

          # Locate application Gradle file.
          app_files = [
              "android/app/build.gradle.kts",
              "android/app/build.gradle"
          ]

          app_gradle = next(
              (p for p in app_files if os.path.isfile(p)),
              None
          )

          if not app_gradle:
              raise SystemExit("App build.gradle missing")

          app_kts = app_gradle.endswith(".kts")

          with open(app_gradle, encoding="utf-8") as f:
              app = f.read()

          # Package name
          app = re.sub(
              r'com\.universal\.universal_messenger',
              'com.universal.messenger',
              app
          )

          if "com.universal.messenger" not in app:
              if app_kts:
                  app = re.sub(
                      r'(?m)^\s*namespace\s*=.*$',
                      '    namespace = "com.universal.messenger"',
                      app
                  )
              else:
                  app = re.sub(
                      r'(?m)^\s*namespace\s+.*$',
                      '    namespace "com.universal.messenger"',
                      app
                  )

          # Ensure Google plugin in application plugin block.
          if "com.google.gms.google-services" not in app:
              if app_kts:
                  app = re.sub(
                      r'(id\(["\']com\.android\.application["\']\)[^\n]*\n)',
                      r'\1    id("com.google.gms.google-services")\n',
                      app,
                      count=1
                  )
              else:
                  app = re.sub(
                      r'(?m)^(\s*id\s+["\']com\.android\.application["\'][^\n]*\n)',
                      r'\1    id "com.google.gms.google-services"\n',
                      app,
                      count=1
                  )

          # SDK settings.
          if app_kts:
              app = re.sub(
                  r'(?m)^(\s*)compileSdk\s*=.*$',
                  r'\1compileSdk = 35',
                  app
              )
              app = re.sub(
                  r'(?m)^(\s*)minSdk\s*=.*$',
                  r'\1minSdk = 23',
                  app
              )
              app = re.sub(
                  r'(?m)^(\s*)targetSdk\s*=.*$',
                  r'\1targetSdk = 35',
                  app
              )
          else:
              app = re.sub(
                  r'(?m)^(\s*)compileSdk(?:Version)?\s*(?:=)?\s*.*$',
                  r'\1compileSdk 35',
                  app
              )
              app = re.sub(
                  r'(?m)^(\s*)minSdk(?:Version)?\s*(?:=)?\s*.*$',
                  r'\1minSdkVersion 23',
                  app
              )
              app = re.sub(
                  r'(?m)^(\s*)targetSdk(?:Version)?\s*(?:=)?\s*.*$',
                  r'\1targetSdkVersion 35',
                  app
              )

          # Enable multidex inside defaultConfig.
          if "multiDexEnabled" not in app:
              match = re.search(r'defaultConfig\s*\{', app)
              if not match:
                  raise SystemExit("defaultConfig block not found")

              insertion = (
                  "\n        multiDexEnabled = true\n"
                  if app_kts
                  else "\n        multiDexEnabled true\n"
              )

              pos = match.end()
              app = app[:pos] + insertion + app[pos:]

          # Signing configuration.
          if "create(\"release\")" not in app and "release {" not in app:
              raise SystemExit("Release buildTypes block not found")

          if app_kts:
              signing = """
              signingConfigs {
                  create("release") {
                      storeFile = file("release.jks")
                      storePassword = project.findProperty("RELEASE_STORE_PASSWORD") as String
                      keyAlias = project.findProperty("RELEASE_KEY_ALIAS") as String
                      keyPassword = project.findProperty("RELEASE_KEY_PASSWORD") as String
                  }
              }
          """
              if "create(\"release\")" not in app:
                  app = re.sub(
                      r'(?m)^\s*buildTypes\s*\{',
                      signing + "\n    buildTypes {",
                      app,
                      count=1
                  )

              app = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("release")',
                  app
              )

              app = re.sub(
                  r'(release\s*\{)',
                  r'\1\n            signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = true\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                  app,
                  count=1
              )

          else:
              signing = """
              signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storePassword project.findProperty("RELEASE_STORE_PASSWORD")
                      keyAlias project.findProperty("RELEASE_KEY_ALIAS")
                      keyPassword project.findProperty("RELEASE_KEY_PASSWORD")
                  }
              }
          """
              if "signingConfigs {" not in app:
                  app = re.sub(
                      r'(?m)^\s*buildTypes\s*\{',
                      signing + "\n    buildTypes {",
                      app,
                      count=1
                  )

              app = re.sub(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  app
              )

              app = re.sub(
                  r'(release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release\n            minifyEnabled true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"',
                  app,
                  count=1
              )

          # Avoid duplicate release settings.
          with open(app_gradle, "w", encoding="utf-8") as f:
              f.write(app)

          print("Configured application:", app_gradle)
          PYEOF

          python3 configure_gradle.py
          rm configure_gradle.py

      # 8. Release signing
      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

          test -s android/app/release.jks

          STORE_PASS="${KEYSTORE_PASSWORD:-Messenger@2026}"
          ALIAS="${KEY_ALIAS:-messenger_key}"
          KEY_PASS="${KEY_PASSWORD:-Messenger@2026}"

          {
            echo "RELEASE_STORE_PASSWORD=$STORE_PASS"
            echo "RELEASE_KEY_ALIAS=$ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

          keytool -list \
            -keystore android/app/release.jks \
            -storepass "$STORE_PASS" \
            -alias "$ALIAS"

      # 9. ProGuard rules
      - name: Configure ProGuard
        run: |
          set -euo pipefail

          cat > android/app/proguard-rules.pro <<'EOF'
          -keep class **.zego.** { *; }
          -keep class **.zegocloud.** { *; }
          -keep class im.zego.** { *; }
          -keep class com.zego.** { *; }
          -keep class com.google.firebase.** { *; }
          -keepattributes *Annotation*
          -keepattributes Signature
          -dontwarn im.zego.**
          -dontwarn com.zego.**
          EOF

          if ! grep -q 'android.enableJetifier=true' android/gradle.properties; then
            echo 'android.enableJetifier=true' >> android/gradle.properties
          fi

          if ! grep -q 'android.useAndroidX=true' android/gradle.properties; then
            echo 'android.useAndroidX=true' >> android/gradle.properties
          fi

      # 10. Patch only third-party Pub packages
      - name: Fix Third Party Android Plugin Order
        run: |
          set -euo pipefail

          cat > fix_plugins.py <<'PYEOF'
          import os
          import re
          import json
          import urllib.parse

          config = ".dart_tool/package_config.json"

          if not os.path.isfile(config):
              raise SystemExit("package_config.json missing")

          with open(config, encoding="utf-8") as f:
              packages = json.load(f)["packages"]

          patched = 0

          for pkg in packages:
              uri = pkg.get("rootUri", "")

              if uri.startswith("file://"):
                  root = urllib.parse.unquote(
                      urllib.parse.urlparse(uri).path
                  )
              else:
                  root = os.path.realpath(
                      os.path.join(".dart_tool", uri)
                  )

              android_dir = os.path.join(root, "android")

              if not os.path.isdir(android_dir):
                  continue

              for current, dirs, files in os.walk(android_dir):
                  dirs[:] = [
                      d for d in dirs
                      if d not in ("build", ".gradle", ".dart_tool")
                  ]

                  for filename in files:
                      if filename not in (
                          "build.gradle",
                          "build.gradle.kts"
                      ):
                          continue

                      path = os.path.join(current, filename)

                      with open(path, encoding="utf-8", errors="ignore") as f:
                          original = f.read()

                      if "LibraryExtension" not in original and "android {" not in original:
                          continue

                      if not re.search(
                          r'kotlin-android|org\.jetbrains\.kotlin\.android|kotlin\(["\']android',
                          original
                      ):
                          continue

                      text = original
                      kts = filename.endswith(".kts")

                      # Reorder plugin DSL declarations.
                      match = re.search(
                          r'plugins\s*\{([^{}]*)\}',
                          text,
                          flags=re.S
                      )

                      if match:
                          block = match.group(1)
                          lines = block.splitlines()

                          android_lines = [
                              x for x in lines
                              if "com.android.library" in x
                          ]

                          kotlin_lines = [
                              x for x in lines
                              if (
                                  "kotlin-android" in x
                                  or "org.jetbrains.kotlin.android" in x
                                  or 'kotlin("android")' in x
                              )
                          ]

                          if kotlin_lines:
                              remaining = [
                                  x for x in lines
                                  if x not in android_lines
                              ]

                              if not android_lines:
                                  android_lines = [
                                      '    id("com.android.library")'
                                      if kts else
                                      '    id "com.android.library"'
                                  ]

                              first_kotlin = next(
                                  i for i, line in enumerate(remaining)
                                  if (
                                      "kotlin-android" in line
                                      or "org.jetbrains.kotlin.android" in line
                                      or 'kotlin("android")' in line
                                  )
                              )

                              remaining[first_kotlin:first_kotlin] = android_lines

                              new_block = "\n".join(remaining)

                              text = (
                                  text[:match.start(1)]
                                  + new_block
                                  + text[match.end(1):]
                              )

                      else:
                          # Legacy imperative plugin declarations.
                          pattern = re.compile(
                              r'(?m)^([ \t]*apply plugin:\s*["\']'
                              r'(?:kotlin-android|org\.jetbrains\.kotlin\.android)'
                              r'["\'].*)$'
                          )

                          if pattern.search(text):
                              android_apply = (
                                  'apply plugin: "com.android.library"\n'
                              )

                              if "apply plugin: \"com.android.library\"" not in text and \
                                 "apply plugin: 'com.android.library'" not in text:
                                  text = pattern.sub(
                                      lambda m: android_apply + m.group(1),
                                      text,
                                      count=1
                                  )

                      if text != original:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(text)

                          patched += 1
                          print("Patched third-party plugin:", path)

          print("Total patched files:", patched)
          PYEOF

          python3 fix_plugins.py
          rm fix_plugins.py

      # 11. Validate Gradle
      - name: Validate Gradle Configuration
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew tasks --no-daemon

      # 12. Build release
      - name: Build Universal Messenger APK
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64,android-arm

      # 13. Verify and rename APK
      - name: Prepare APK
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          cp "$APK" Universal-Messenger.apk

          ls -lh Universal-Messenger.apk

      # 14. Publish GitHub Release
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="v4.0.${{ github.run_number }}"
          TITLE="Universal Messenger v4.0.${{ github.run_number }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              Universal-Messenger.apk \
              --clobber
          else
            gh release create "$TAG" \
              Universal-Messenger.apk \
              --title "$TITLE" \
              --notes "Universal Messenger Android Release"
          fi

          echo "GitHub Release published: $TAG"
