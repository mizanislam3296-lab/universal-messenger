name: Build & Release Universal Messenger APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Android APK
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: Publish GitHub Release v14.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v14.0.0
          name: Universal Messenger v14.0.0
          body: Direct Android APK release for Universal Messenger v14.0.0 (arm64-v8a).
          files: build/app/outputs/flutter-apk/Universal-Messenger.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
