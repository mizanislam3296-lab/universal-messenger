name: Build Universal Messenger APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          flutter create . --platforms=android --org com.universal --project-name universal_messenger

      - name: Configure Firebase, PiP, Screen Share & Native Channel
        run: |
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/kotlin/com/universal/universal_messenger

          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json ফাইলটি রিপোজিটরিতে পাওয়া যায়নি!"
            exit 1
          fi

          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="app_files" path="." />
              <cache-path name="app_cache" path="." />
              <external-path name="external_files" path="." />
          </paths>
          EOF

          cat << 'EOF' > android/app/src/main/kotlin/com/universal/universal_messenger/MainActivity.kt
          package com.universal.universal_messenger

          import android.app.PictureInPictureParams
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import android.util.Rational
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.universal.messenger/icon"
              private var isCallActive = false
              private var activeRingtone: Ringtone? = null
              private var mediaPlayer: MediaPlayer? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "setCallActive" -> {
                              isCallActive = call.argument<Boolean>("active") ?: false
                              result.success(true)
                          }
                          "isNetworkConnected" -> {
                              val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                              val net = cm.activeNetwork
                              val caps = cm.getNetworkCapabilities(net)
                              val connected = caps != null && (
                                  caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ||
                                  caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) ||
                                  caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET)
                              )
                              result.success(connected)
                          }
                          "playRingtone" -> {
                              stopRingtoneInternal()
                              try {
                                  val path = call.argument<String>("path")
                                  val uri = if (!path.isNullOrEmpty() && File(path).exists()) {
                                      Uri.fromFile(File(path))
                                  } else {
                                      RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                                  }
                                  activeRingtone = RingtoneManager.getRingtone(applicationContext, uri)
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                      activeRingtone?.isLooping = true
                                  }
                                  activeRingtone?.play()
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "stopRingtone" -> {
                              stopRingtoneInternal()
                              result.success(true)
                          }
                          "playMessageSound" -> {
                              try {
                                  mediaPlayer?.release()
                                  val path = call.argument<String>("path")
                                  val uri = if (!path.isNullOrEmpty() && File(path).exists()) {
                                      Uri.fromFile(File(path))
                                  } else {
                                      RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                                  }
                                  mediaPlayer = MediaPlayer().apply {
                                      setAudioAttributes(
                                          AudioAttributes.Builder()
                                              .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                              .build()
                                      )
                                      setDataSource(applicationContext, uri)
                                      prepare()
                                      start()
                                  }
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "getContentUri" -> {
                              try {
                                  val path = call.argument<String>("path") ?: ""
                                  val file = File(path)
                                  val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                                  result.success(uri.toString())
                              } catch (e: Exception) {
                                  result.success(null)
                              }
                          }
                          "installApk" -> {
                              try {
                                  val path = call.argument<String>("path") ?: ""
                                  val file = File(path)
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                                      val intent = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName"))
                                      startActivity(intent)
                                      result.success("PERMISSION_REQUIRED")
                                  } else {
                                      val apkUri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                                      val intent = Intent(Intent.ACTION_VIEW).apply {
                                          setDataAndType(apkUri, "application/vnd.android.package-archive")
                                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                                      }
                                      startActivity(intent)
                                      result.success("STARTED")
                                  }
                              } catch (e: Exception) {
                                  result.error("INSTALL_ERR", e.message, null)
                              }
                          }
                          else -> result.success(null)
                      }
                  }
              }

              private fun stopRingtoneInternal() {
                  try {
                      activeRingtone?.stop()
                      activeRingtone = null
                  } catch (_: Exception) {}
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (isCallActive && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          val params = PictureInPictureParams.Builder()
                              .setAspectRatio(Rational(9, 16))
                              .build()
                          enterPictureInPictureMode(params)
                      } catch (_: Exception) {}
                  }
              }

              override fun onDestroy() {
                  stopRingtoneInternal()
                  mediaPlayer?.release()
                  super.onDestroy()
              }
          }
          EOF

          python3 -c '
          import os

          if os.path.exists("android/settings.gradle.kts"):
              with open("android/settings.gradle.kts", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  out.append(l)
                  if "com.android.application" in l and "apply false" in l:
                      out.append("    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false")
              with open("android/settings.gradle.kts", "w") as f:
                  f.write("\n".join(out) + "\n")
          elif os.path.exists("android/settings.gradle"):
              with open("android/settings.gradle", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  out.append(l)
                  if "com.android.application" in l and "apply false" in l:
                      out.append("    id \"com.google.gms.google-services\" version \"4.4.2\" apply false")
              with open("android/settings.gradle", "w") as f:
                  f.write("\n".join(out) + "\n")

          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  if "minSdk =" in l or "minSdkVersion" in l:
                      out.append("        minSdk = 23")
                      out.append("        multiDexEnabled = true")
                      continue
                  if "targetSdk =" in l or "targetSdkVersion" in l:
                      out.append("        targetSdk = 34")
                      continue
                  out.append(l)
                  if "id(\"com.android.application\")" in l:
                      out.append("    id(\"com.google.gms.google-services\")")
                  if "sourceCompatibility" in l:
                      out.append("        isCoreLibraryDesugaringEnabled = true")
              out.append("\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n")
              with open("android/app/build.gradle.kts", "w") as f:
                  f.write("\n".join(out) + "\n")

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              perms = [
                  "android.permission.INTERNET",
                  "android.permission.ACCESS_NETWORK_STATE",
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.VIBRATE",
                  "android.permission.WAKE_LOCK",
                  "android.permission.RECEIVE_BOOT_COMPLETED",
                  "android.permission.CAMERA",
                  "android.permission.RECORD_AUDIO",
                  "android.permission.MODIFY_AUDIO_SETTINGS",
                  "android.permission.BLUETOOTH",
                  "android.permission.BLUETOOTH_CONNECT",
                  "android.permission.FOREGROUND_SERVICE",
                  "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION",
                  "android.permission.FOREGROUND_SERVICE_CAMERA",
                  "android.permission.FOREGROUND_SERVICE_MICROPHONE",
                  "android.permission.REQUEST_INSTALL_PACKAGES",
              ]
              perm_tags = ""
              for p in perms:
                  if p not in m:
                      perm_tags += f"    <uses-permission android:name=\"{p}\"/>\n"
              if perm_tags:
                  m = m.replace("<application", perm_tags + "    <application", 1)

              m = m.replace(
                  "android:name=\".MainActivity\"",
                  "android:name=\".MainActivity\"\n            android:supportsPictureInPicture=\"true\"\n            android:resizeableActivity=\"true\"",
                  1
              )

              provider_xml = """        <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="${applicationId}.fileprovider"
              android:exported="false"
              android:grantUriPermissions="true">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/file_paths" />
          </provider>
          <meta-data
              android:name="com.google.firebase.messaging.default_notification_channel_id"
              android:value="fcm_msg_all_v1" />
      </application>"""
              if "androidx.core.content.FileProvider" not in m:
                  m = m.replace("</application>", provider_xml, 1)

              with open(manifest_path, "w") as f:
                  f.write(m)
          '

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            FCM_B64=$(printf '%s' "$FCM_SERVICE_ACCOUNT" | base64 -w 0)
            flutter build apk --release --split-per-abi --dart-define=FCM_SA_B64=$FCM_B64
          else
            flutter build apk --release --split-per-abi
          fi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Messenger-v14-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v14.0.0
          name: Universal Messenger v14.0.0
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
