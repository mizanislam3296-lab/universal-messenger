name: Build Universal Messenger APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          flutter create . --platforms=android --org com.universal --project-name universal_messenger

      - name: Configure Firebase & Universal Android Support
        run: |
          mkdir -p android/app
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json ফাইলটি রিপোজিটরিতে পাওয়া যায়নি!"
            exit 1
          fi

          python3 -c '
          import os

          # 1. Patch settings.gradle.kts or settings.gradle
          if os.path.exists("android/settings.gradle.kts"):
              with open("android/settings.gradle.kts", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  out.append(l)
                  if "com.android.application" in l and "apply false" in l:
                      out.append("    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false")
              with open("android/settings.gradle.kts", "w") as f:
                  f.write("\n".join(out) + "\n")
          elif os.path.exists("android/settings.gradle"):
              with open("android/settings.gradle", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  out.append(l)
                  if "com.android.application" in l and "apply false" in l:
                      out.append("    id \"com.google.gms.google-services\" version \"4.4.2\" apply false")
              with open("android/settings.gradle", "w") as f:
                  f.write("\n".join(out) + "\n")

          # 2. Patch app/build.gradle.kts or app/build.gradle (minSdk 23 for FCM + MultiDex + Google Services)
          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  if "minSdk =" in l or "minSdkVersion" in l:
                      out.append("        minSdk = 23")
                      out.append("        multiDexEnabled = true")
                      continue
                  out.append(l)
                  if "id(\"com.android.application\")" in l:
                      out.append("    id(\"com.google.gms.google-services\")")
              with open("android/app/build.gradle.kts", "w") as f:
                  f.write("\n".join(out) + "\n")
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r") as f:
                  lines = f.read().splitlines()
              out = []
              for l in lines:
                  if "minSdk =" in l or "minSdkVersion" in l:
                      out.append("        minSdkVersion 23")
                      out.append("        multiDexEnabled true")
                      continue
                  out.append(l)
                  if "com.android.application" in l:
                      out.append("    id \"com.google.gms.google-services\"")
              with open("android/app/build.gradle", "w") as f:
                  f.write("\n".join(out) + "\n")

          # 3. Ensure Permissions & PiP Support in AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              perms = [
                  "android.permission.INTERNET",
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.VIBRATE",
                  "android.permission.WAKE_LOCK",
                  "android.permission.RECEIVE_BOOT_COMPLETED",
              ]
              perm_tags = ""
              for p in perms:
                  if p not in m:
                      perm_tags += f"    <uses-permission android:name=\"{p}\"/>\n"
              if perm_tags:
                  m = m.replace("<application", perm_tags + "    <application", 1)
              if "supportsPictureInPicture" not in m:
                  m = m.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\"\n            android:supportsPictureInPicture=\"true\"", 1)
              with open(manifest_path, "w") as f:
                  f.write(m)
          '

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            FCM_B64=$(printf '%s' "$FCM_SERVICE_ACCOUNT" | base64 -w 0)
            flutter build apk --release --dart-define=FCM_SA_B64=$FCM_B64
          else
            flutter build apk --release
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Messenger-Step1-APK
          path: build/app/outputs/flutter-apk/app-release.apk
