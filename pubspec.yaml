name: universal_messenger
description: Universal Messenger with Audio/Video Calls and Fast File Sharing.
publish_to: 'none'
version: 14.0.0+14

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  googleapis_auth: ^1.6.0
  flutter_local_notifications: any
  zego_uikit_prebuilt_call: any
  dio: any
  file_picker: any
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
